# Runs the typecheck and all our tests (backend/ and integrations/) on every pull request
# and on every push to main. vellum/ is not tested here; it has its own tests.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to exact commits (actions/checkout v4.2.2, oven-sh/setup-bun v2.0.2).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check
