# Copies only the contents of website/ onto the website-deploy branch.
# Hostinger (hPanel > Advanced > GIT) deploys that branch into public_html.
name: Website deploy branch

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish website/ to website-deploy
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep a copy of the site before switching branches. README.md and _headers are not served.
          SITE="$RUNNER_TEMP/site"
          rm -rf "$SITE" && mkdir -p "$SITE"
          cp -a website/. "$SITE/"
          rm -f "$SITE/README.md" "$SITE/_headers"
          rm -f "$SITE/vercel.json"

          # Switch to the deploy branch, or start it empty the first time.
          if git ls-remote --exit-code --heads origin website-deploy >/dev/null; then
            git checkout -B website-deploy origin/website-deploy
          else
            git checkout --orphan website-deploy
          fi

          # Replace everything on the branch with the site files only.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SITE/." .
          git add -A

          if git rev-parse --verify -q HEAD >/dev/null && git diff --cached --quiet; then
            echo "Website unchanged, nothing to deploy."
            exit 0
          fi
          git commit -m "Deploy website from ${GITHUB_SHA::7}"
          git push origin website-deploy
